# display: shown on the website and at checkout. charge: the amount and currency sent to PayU.
# Until PayU confirms which currencies the account can charge in, the INR charge price is active.
- product: offer_letter
  purpose: display
  currency: USD
  amount_minor: 900
  active: true
- product: offer_letter
  purpose: charge
  currency: INR
  amount_minor: 79900
  active: true
  notes: Placeholder. Set the real rupee amount once PayU confirms international payments.
- product: offer_letter
  purpose: charge
  currency: USD
  amount_minor: 900
  active: false
  notes: Switch on (and the INR row off) when PayU approves charging in USD.
