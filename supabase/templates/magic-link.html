<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#F7F7F4;font-family:'IBM Plex Sans',Arial,sans-serif;color:#14181F">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F7F4;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E3E3DE;border-radius:12px">
            <tr>
              <td style="padding:28px 28px 8px">
                <p style="margin:0;font-family:Georgia,serif;font-size:20px;color:#0F6E5F">AI Company Wala</p>
                <h1 style="margin:20px 0 8px;font-size:22px;font-weight:600">Sign in to AI Company Wala</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.55;color:#3D4451">
                  Select the button to sign in. The link works once and expires in 15 minutes.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/dashboard"
                     style="display:inline-block;padding:14px 22px;border-radius:10px;background:#0F6E5F;color:#FFFFFF;font-size:15px;font-weight:600;text-decoration:none">
                    Sign in
                  </a>
                </p>
                <p style="margin:0 0 24px;font-size:13px;line-height:1.55;color:#5B6472">
                  Or enter this code on the sign-in page: <strong style="color:#14181F;letter-spacing:0.1em">{{ .Token }}</strong><br>
                  If you didn’t ask to sign in, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
